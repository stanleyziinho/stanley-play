<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#130922">
<title>STANLEY RETRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0b0715,#24103f);color:white;font-family:Arial,sans-serif;min-height:100vh}
main{max-width:960px;margin:auto;padding:20px}
a{color:#c4a2ff;text-decoration:none}
h1{font-size:32px;margin-top:30px}
h1 span{color:#b06cff}
.panel{background:#1e1231;border:1px solid #593487;border-radius:18px;padding:20px;margin:20px 0}
label{display:block;margin:15px 0 8px;font-weight:bold}
select,input{display:block;width:100%;background:#301b48;color:white;border:1px solid #7946aa;border-radius:12px;padding:14px;font-size:16px}
button{background:#813de5;color:white;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:bold;margin-top:18px}
button:disabled{opacity:.5}
p{color:#c9b9de;line-height:1.6}
#game{width:100%;height:500px;background:#07040e;border-radius:12px}
#player{display:none}
</style>
</head>
<body>
<main>
<a href="index.html">← Voltar ao STANLEY PLAY</a>
<h1>🕹 STANLEY <span>RETRO</span></h1>
<p>Seu console de jogos clássicos diretamente no navegador.</p>
<section class="panel" id="setup">
<h2>Escolha seu console</h2>
<label for="core">Console</label>
<select id="core">
<option value="nes">Nintendo NES</option>
<option value="snes">Super Nintendo</option>
<option value="segaMD">Mega Drive / Genesis</option>
<option value="gb">Game Boy</option>
<option value="gbc">Game Boy Color</option>
<option value="gba">Game Boy Advance</option>
</select>
<label for="rom">Importar ROM autorizada</label>
<input id="rom" type="file" accept=".nes,.sfc,.smc,.md,.gen,.bin,.gb,.gbc,.gba,.zip">
<p>Selecione um arquivo de jogo que você tenha autorização para utilizar. Nenhuma ROM comercial está incluída.</p>
<button id="start" disabled>▶ INICIAR JOGO</button>
<p id="status"></p>
</section>
<section class="panel" id="player">
<button onclick="location.reload()">↩ Trocar jogo</button>
<p>Use os controles virtuais, teclado ou controle compatível.</p>
<div id="game"></div>
</section>
</main>
<script>
const rom=document.getElementById('rom');
const core=document.getElementById('core');
const start=document.getElementById('start');
const status=document.getElementById('status');
rom.addEventListener('change',()=>{
start.disabled=!rom.files.length;
status.textContent=rom.files.length?'Arquivo selecionado: '+rom.files[0].name:'';
});
start.addEventListener('click',()=>{
if(!rom.files.length)return;
const file=rom.files[0];
const allowed={
nes:['nes','zip'],
snes:['sfc','smc','zip'],
segaMD:['md','gen','bin','zip'],
gb:['gb','zip'],
gbc:['gbc','zip'],
gba:['gba','zip']
};
const ext=file.name.split('.').pop().toLowerCase();
if(!allowed[core.value].includes(ext)){
status.textContent='Arquivo incompatível com o console selecionado.';
return;
}
const fileUrl=URL.createObjectURL(file);
document.getElementById('setup').style.display='none';
document.getElementById('player').style.display='block';
window.EJS_player='#game';
window.EJS_core=core.value;
window.EJS_gameUrl=fileUrl;
window.EJS_gameName=file.name;
window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
window.EJS_color='#8b5cf6';
window.EJS_startOnLoaded=true;
const script=document.createElement('script');
script.src='https://cdn.emulatorjs.org/stable/data/loader.js';
script.onerror=()=>{
document.getElementById('player').insertAdjacentHTML('beforeend','<p>Erro ao carregar o emulador. Verifique a internet.</p>');
};
document.body.appendChild(script);
});
</script>
</body>
</html>
